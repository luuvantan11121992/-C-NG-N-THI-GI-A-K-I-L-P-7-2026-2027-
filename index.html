 khi trả tiền vé."}, {"label": "B", "text": "You can change your seats before paying for tickets.: Bạn có thể đổi chỗ trước khi trả tiền vé."}, {"label": "C", "text": "You should change your seats if you can see the film.: Bạn nên đổi chỗ nếu bạn có thể xem phim."}, {"label": "D", "text": "You can change your seats if you like.: Bạn có thể đổi chỗ nếu thích."}], "correct": ["B"], "accepted": [], "explanation": "Giải thích: “Cannot change after paying” tức là chỉ được đổi trước khi trả tiền. Đây là cách diễn đạt lại bằng ý ngược lại (paraphrase). A trái hẳn thông báo.", "context": "", "source": ["54. What does the notice say?", "[Thông báo ở rạp chiếu phim: “We cannot change your seats after you’ve paid for tickets.” (Chúng tôi không thể đổi chỗ ngồi của bạn sau khi bạn đã trả tiền mua vé.)]", "A. You can change your seats after paying for tickets.: Bạn có thể đổi chỗ sau khi trả tiền vé.", "B. You can change your seats before paying for tickets.: Bạn có thể đổi chỗ trước khi trả tiền vé.", "C. You should change your seats if you can see the film.: Bạn nên đổi chỗ nếu bạn có thể xem phim.", "D. You can change your seats if you like.: Bạn có thể đổi chỗ nếu thích.", "Đáp án: B", "Giải thích: “Cannot change after paying” tức là chỉ được đổi trước khi trả tiền. Đây là cách diễn đạt lại bằng ý ngược lại (paraphrase). A trái hẳn thông báo."], "id": 71, "sectionIndex": 2, "withinSection": 4}, {"section": "III. SIGNS", "number": 5, "prompt": "55. What does the notice say?\n[Biển cấm có hình điện thoại bị gạch chéo và chữ “No mobile phones”.]", "options": [{"label": "A", "text": "Do not hold your phone: Đừng cầm điện thoại."}, {"label": "B", "text": "Mobile phones are dangerous: Điện thoại di động nguy hiểm."}, {"label": "C", "text": "Please use your mobile phone outside: Vui lòng dùng điện thoại di động ở bên ngoài."}, {"label": "D", "text": "Do not use your friend’s phone the film.: Đừng dùng điện thoại của bạn mình (câu thiếu từ, sai ngữ pháp)."}], "correct": ["C"], "acce ps his father clean the garage and wash the car. He (3)_______ watches TV because he enjoys spending time outside. He has a lot of friends and he plays badminton with them three times a week. In the evenings, he often reads comic books before going to bed. He also likes (4)_______, and he sometimes paints pictures (5)_______ animals. Mark is very (6)_______ and always full of energy!", "source": ["3. Đáp án: D. rarely", "A. always: luôn luôn.", "B. usually: thường xuyên.", "C. often: thường.", "D. rarely: hiếm khi.", "Giải thích: Vế sau là “because he enjoys spending time outside” (vì thích ở ngoài trời), nên cậu ít xem TV. Quan hệ nguyên nhân – kết quả quyết định đáp án."], "id": 75, "sectionIndex": 3, "withinSection": 3}, {"section": "IV. PASSAGE – MULTIPLE CHOICES", "number": 4, "prompt": "Chọn đáp án đúng cho chỗ trống số 4.", "options": [{"label": "A", "text": "draw: vẽ."}, {"label": "B", "text": "draws: vẽ (ngôi thứ ba)."}, {"label": "C", "text": "drawing: việc vẽ."}, {"label": "D", "text": "drew: đã vẽ."}], "correct": ["C"], "accepted": [], "explanation": "A. draw: vẽ.\nB. draws: vẽ (ngôi thứ ba).\nC. drawing: việc vẽ.\nD. drew: đã vẽ.\nGiải thích: Sau “like” dùng V-ing (cấu trúc like + V-ing ở bài về sở thích, Unit 1).", "context": "READING A\nMark has many hobbies and interests. He usually (1)_______ early, so he can do some exercises before school. After school, Mark often rides his (2)_______ around the park near his home. Sometimes he goes cycling with his cousin on Sunday mornings. He also loves music. He goes to guitar class on Tuesday and Thursday evenings. On Saturday mornings, he usually helps his father clean the garage and wash the car. He (3)_______ watches TV because he enjoys spending time outside. He has a lot of friends and he plays badminton with them three times a week. In the evenings, he often reads comic books before going to bed. He also likes (4)_______, and he sometimes paints pictures (5)_______ animals. Mark is very (6)_______ and always full of energy!", "source": ["4. Đáp án: C. drawing", "A. draw: vẽ.", "B. draws: vẽ (ngôi thứ ba).", "C. drawing: việc vẽ.", "D. drew: đã vẽ.", "Giải thích: Sau “like” dùng V-ing (cấu trúc like + V-ing ở bài về sở thích, Unit 1)."], "id": 76, "sectionIndex": 3, "withinSection": 4}, {"section": "IV. PASSAGE – MULTIPLE CHOICES", "number": 5, "prompt": "Chọn đáp án đúng cho chỗ trống số 5.", "options": [{"label": "A", "text": "of: của / về."}, {"label": "B", "text": "in: trong."}, {"label": "C", "text": "on: trên."}, {"label": "D", "text": "with: cùng với."}], "correct": ["A"], "accepted": [], "explanation": "A. of: của / về.\nB. in: trong.\nC. on: trên.\nD. with: cùng với.\nGiải thích: “Pictures of animals” là tranh về động vật; “of” chỉ đối tượng được vẽ.", "context": "READING A\nMark has many hobbies and interests. He usually (1)_______ early, so he can do some exercises before school. After school, Mark often rides his (2)_______ around the park near his home. Sometimes he goes cycling with his cousin on Sunday mornings. He also loves music. He goes to guitar class on Tuesday and Thursday evenings. On Saturday mornings, he usually helps his father clean the garage and wash the car. He (3)_______ watches TV because he enjoys spending time outside. He has a lot of friends and he plays badminton with them three times a week. In the evenings, he often reads comic books before going to bed. He also likes (4)_______, and he sometimes paints pictures (5)_______ animals. Mark is very (6)_______ and always full of energy!", "source": ["5. Đáp án: A. of", "A. of: của / về.", "B. in: trong.", "C. on: trên.", "D. with: cùng với.", "Giải thích: “Pictures of animals” là tranh về động vật; “of” chỉ đối tượng được vẽ."], "id": 77, "sectionIndex": 3, "withinSection": 5}, {"section": "IV. PASSAGE – MULTIPLE CHOICES", "number": 6, "prompt": "Chọn đáp án đúng cho chỗ trống số 6.", "options": [{"label": "A", "text": "active: năng động."}, {"label": "B", "text": "helpful: hay giúp đỡ."}, {"label": "C", "text": "strong: khỏe."}, {"label": "D", "text": "sporty: thích thể thao."}], "correct": ["A"], "accepted": [], "explanation": "A. active: năng động.\nB. helpful: hay giúp đỡ.\nC. strong: khỏe.\nD. sporty: thích thể thao.\nGiải thích: Vế sau là “always full of energy” (luôn đầy năng lượng); chỉ “active” phù hợp. Cả bài nói Mark hoạt động liên tục, không chỉ nói về thể thao.\nREADING B\nBài đọc (đáp án in đậm): Healthy (1) habits help us keep fit and avoid many diseases. Here is some advice. Eat more fruit and vegetables, especially coloured ones like carrots and tomatoes. They (2) provide a lot of vitamins. Eat meat, eggs, and cheese, but not too much. You may (3) put on weight. Drink enough water, but not soft drinks. Be active and exercise every day. Do outdoor activities (4) like cycling, swimming, or playing sports. They keep us fit. Go to bed early and get about 8 hours of sleep daily, so you will not feel (5) tired. Keep your room tidy and clean. Open windows to let in fresh air and (6) sunshine on fine days.\nDịch bài: Những thói quen lành mạnh giúp chúng ta giữ dáng và tránh nhiều bệnh. Sau đây là vài lời khuyên. Hãy ăn nhiều trái cây và rau, đặc biệt là những loại có màu như cà rốt và cà chua. Chúng cung cấp nhiều vitamin. Hãy ăn thịt, trứng và phô mai, nhưng đừng quá nhiều. Bạn có thể tăng cân. Hãy uống đủ nước, nhưng đừng uống nước ngọt. Hãy năng động và tập thể dục mỗi ngày. Hãy tham gia các hoạt động ngoài trời như đạp xe, bơi lội hoặc chơi thể thao. Chúng giúp chúng ta khỏe mạnh. Hãy đi ngủ sớm và ngủ khoảng 8 giờ mỗi ngày để không cảm thấy mệt. Hãy giữ phòng gọn gàng và sạch sẽ. Hãy mở cửa sổ để đón không khí trong lành và ánh nắng vào những ngày đẹp trời.", "context": "READING A\nMark has many hobbies and interests. He usually (1)_______ early, so he can do some exercises before school. After school, Mark often rides his (2)_______ around the park near his home. Sometimes he goes cycling with his cousin on Sunday mornings. He a ong thị trấn. Trường cần thêm sách cho thư viện. Nam và bạn bè đã thu thập sách cũ từ gia đình và hàng xóm. Các bạn mang hơn 100 cuốn sách đến trường. Các bạn cũng lau dọn các lớp học và trồng một số bông hoa trong vườn trường.\nNam cảm thấy rất vui sau hoạt động. Bạn thích làm việc cùng bạn bè và giúp đỡ các em nhỏ. Bạn nghĩ phục vụ cộng đồng hữu ích vì nó giúp mọi người và làm khu phố sạch hơn, đẹp hơn. Nam muốn tham gia nhiều hoạt động cộng đồng hơn trong tương lai.\nA. True or False", "source": ["6. Why does Nam think community service is useful? (Vì sao Nam nghĩ phục vụ cộng đồng hữu ích?)", "A. Because it helps people and makes the neighbourhood better.  B. Because he can get a lot of money.  C. Because he can stay at home with his friends.  D. Because he does not have to study.", "Đáp án: A. Because it helps people and makes the neighbourhood better.", "Giải thích: Đoạn 3: “…useful because it helps people and makes the neighbourhood cleaner and more beautiful.”"], "id": 108, "sectionIndex": 4, "withinSection": 18}]}, {"title": "VI. WORD FORMATION", "intro": "Mẹo làm bài: trước hết xác định từ loại cần điền (danh từ, động từ, tính từ hay trạng từ), sau đó thêm tiền tố hoặc hậu tố phù hợp. Sau tính từ cần danh từ; bổ nghĩa cho động từ cần trạng từ; sau “be” cần tính từ; sau chủ ngữ cần động từ.", "questions": [{"section": "VI. WORD FORMATION", "number": 1, "prompt": "1. We need to do things _______. (different)", "options": [], "correct": [], "accepted": ["differently"], "explanation": "Dịch: Chúng ta cần làm mọi việc theo cách khác.\nGiải thích: Bổ nghĩa cho động từ “do” cần trạng từ: different → differently.", "context": "Mẹo làm bài: trước hết xác định từ loại cần điền (danh từ, động từ, tính từ hay trạng từ), sau đó thêm tiền tố hoặc hậu tố phù hợp. Sau tính từ cần danh từ; bổ nghĩa cho động từ cần trạng từ; sau “be” cần tính từ; sau chủ ngữ cần động từ.", "source": ["1. We need to do things _______. (different)", "Đáp án: differently", "Dịch: Chúng ta cần làm mọi việc theo cách khác.", "Giải thích: Bổ nghĩa cho động từ “do” cần trạng từ: different → differently."], "id": 109, "sectionIndex": 5, "withinSection": 1}, {"section": "VI. WORD FORMATION", "number": 2, "prompt": "2. He _______ gets home about six o’clock. (usual)", "options": [], "correct": [], "accepted": ["usually"], "explanation": "Dịch: Anh ấy thường về nhà khoảng sáu giờ.\nGiải thích: Trạng từ tần suất đứng trước động từ thường: usual → usually.", "context": "Mẹo làm bài: trước hết xác định từ loại cần điền (danh từ, động từ, tính từ hay trạng từ), sau đó thêm tiền tố hoặc hậu tố phù hợp. Sau tính từ cần danh từ; bổ nghĩa cho động từ cần trạng từ; sau “be” cần tính từ; sau chủ ngữ cần động từ.", "source": ["2. He _______ gets home about six o’clock. (usual)", "Đáp án: usually", "Dịch: Anh ấy thường về nhà khoảng sáu giờ.", "Giải thích: Trạng từ tần suất đứng trước động từ thường: usual → usually."], "id": 110, "sectionIndex": 5, "withinSection": 2}, {"section": "VI. WORD FORMATION", "number": 3, "prompt": "3. She is building the dollhouse _______. (skill)", "options": [], "correct": [], "accepted": ["skilfully (skillfully)", "skilfully", "skillfully"], "explanation": "Dịch: Cô ấy đang xây ngôi nhà búp bê một cách khéo léo.\nGiải thích: Cần trạng từ bổ nghĩa cho “is building”: skill → skilful (tính từ) → skilfully (trạng từ).", "context": "Mẹo làm bài: trước hết xác định từ loại cần điền (danh từ, động từ, tính từ hay trạng từ), sau đó thêm tiền tố hoặc hậu tố phù hợp. Sau tính từ cần danh từ; bổ nghĩa cho động từ cần trạng từ; sau “be” cần tính từ; sau chủ ngữ cần động từ.", "source": ["3. She is building the dollhouse _______. (skill)", "Đáp án: skilfully (skillfully)", "Dịch: Cô ấy đang xây ngôi nhà búp bê một cách khéo léo.", "Giải thích: Cần trạng từ bổ nghĩa cho “is building”: skill → skilful (tính từ) → skilfully (trạng từ)."], "id": 111, "sectionIndex": 5, "withinSection": 3}, {"section": "VI. WORD FORMATION", "number": 4, "prompt": "4. They _______ believe their children should make choices for themselves. (strong)", "options": [], "correct": [], "accepted": ["strongly"], "explanation": "Dịch: Họ tin chắc rằng con cái nên tự đưa ra lựa chọn.\nGiải thích: Trạng từ đứng trước động từ “believe”: strong → strongly (“strongly believe” là cụm hay dùng).", "context": "Mẹo làm bài: trước hết xác định từ loại cần điền (danh từ, động từ, tính từ hay trạng từ), sau đó thêm tiền tố hoặc hậu tố phù hợp. Sau tính từ cần danh từ; bổ nghĩa cho động từ cần trạng từ; sau “be” cần tính từ; sau chủ ngữ cần động từ.", "source": ["4. They _______ believe their children should make choices for themselves. (strong)", "Đáp án: strongly", "Dịch: Họ tin chắc rằng con cái nên tự đưa ra lựa chọn.", "Giải thích: Trạng từ đứng trước động từ “believe”: strong → strongly (“strongly believe” là cụm hay dùng)."], "id": 112, "sectionIndex": 5, "withinSection": 4}, {"section": "VI. WORD FORMATION", "number": 5, "prompt": "5. _______, he never actually said that he was innocent. (interest)", "options": [], "correct": [], "accepted": ["Interestingly"], "explanation": "Dịch: Thật thú vị là anh ta chưa từng nói mình vô tội.\nGiải thích: Trạng từ đứng đầu câu bổ nghĩa cả câu, sau có dấu phẩy: interest → interestingly. Nhớ viết hoa chữ cái đầu.", "context": "Mẹo làm bài: trước hết xác định từ loại cần điền (danh từ, động từ, tính từ hay trạng từ), sau đó thêm tiền tố hoặc hậu tố phù hợp. Sau tính từ cần danh từ; bổ nghĩa cho động từ cần trạng từ; sau “be” cần tính từ; sau chủ ngữ cần động từ.", "source": ["5. _______, he never actually said that he was innocent. (interest)", "Đáp án: Interestingly", "Dịch: Thật thú vị là anh ta chưa từng nói mình vô tội.", "Giải thích: Trạng từ đứng đầu câu bổ nghĩa cả câu, sau có dấu phẩy: interest → interestingly. Nhớ viết hoa chữ cái đầu."], "id": 113, "sectionIndex": 5, "withinSection": 5}, {"section": "VI. WORD FORMATION", "number": 6, "prompt": "6. Your idea _______ from mine. (different)", "options": [], "correct": [], "accepted": ["differs"], "explanation": "Dịch: Ý tưởng của bạn khác với ý tưởng của mình.\nGiải thích: Cần động từ ở hiện tại đơn, chủ ngữ số ít: differ from → differs. (Cũng có thể viết “is different”, nhưng ô trống chỉ có một từ.)", "context": "Mẹo làm bài: trước hết xác định từ loại cần điền (danh từ, động từ, tính từ hay trạng từ), sau đó thêm tiền tố hoặc hậu tố phù hợp. Sau tính từ cần danh từ; bổ nghĩa cho động từ cần trạng từ; sau “be” cần tính từ; sau chủ ngữ cần động từ.", "source": ["6. Your idea _______ from mine. (different)", "Đáp án: differs", "Dịch: Ý tưởng của bạn khác với ý tưởng của mình.", "Giải thích: Cần động từ ở hiện tại đơn, chủ ngữ số ít: differ from → differs. (Cũng có thể viết “is different”, nhưng ô trống chỉ có một từ.)"], "id": 114, "sectionIndex": 5, "withinSection": 6}, {"section": "VI. WORD FORMATION", "number": 7, "prompt": "7. It’s important to _______ your skin from the harmful effects of the sun. (protection)", "options": [], "correct": [], "accepted": ["protect"], "explanation": "Dịch: Điều quan trọng là bảo vệ làn da khỏi tác hại của ánh nắng.\nGiải thích: Sau “to” cần động từ nguyên mẫu: protection → protect.", "context": "Mẹo làm bài: trước hết xác định từ loại cần điền (danh từ, động từ, tính từ hay trạng từ), sau đó thêm tiền tố hoặc hậu tố phù hợp. Sau tính từ cần danh từ; bổ nghĩa cho động từ cần trạng từ; sau “be” cần tính từ; sau chủ ngữ cần động từ.", "source": ["7. It’s important to _______ your skin from the harmful effects of the sun. (protection)", "Đáp án: protect", "Dịch: Điều quan trọng là bảo vệ làn da khỏi tác hại của ánh nắng.", "Giải thích: Sau “to” cần động từ nguyên mẫu: protection → protect."], "id": 115, "sectionIndex": 5, "withinSection": 7}, {"section": "VI. WORD FORMATION", "number": 8, "prompt": "8. They _______ a meeting the teachers and students. (organize)", "options": [], "correct": [], "accepted": ["organised (organized)", "organised", "organized"], "explanation": "Dịch: Họ đã tổ ch i giúp đỡ những người yếu.", "Giải thích: Đối lập với “weak”, cần dạng so sánh hơn của tính từ: strong → stronger."], "id": 133, "sectionIndex": 5, "withinSection": 25}]}, {"title": "VII. SENTENCE REARRANGEMENT", "intro": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "questions": [{"section": "VII. SENTENCE REARRANGEMENT", "number": 1, "prompt": "1. in her free time / likes / reading books / Lan / very much", "options": [], "correct": [], "accepted": ["Lan likes reading books very much in her free time."], "explanation": "Dịch: Lan rất thích đọc sách vào thời gian rảnh.\nGiải thích: Chủ ngữ Lan + like + V-ing + trạng ngữ. “Very much” đứng sau tân ngữ, “in her free time” đứng cuối câu.", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["1. in her free time / likes / reading books / Lan / very much", "Đáp án: Lan likes reading books very much in her free time.", "Dịch: Lan rất thích đọc sách vào thời gian rảnh.", "Giải thích: Chủ ngữ Lan + like + V-ing + trạng ngữ. “Very much” đứng sau tân ngữ, “in her free time” đứng cuối câu."], "id": 134, "sectionIndex": 6, "withinSection": 1}, {"section": "VII. SENTENCE REARRANGEMENT", "number": 2, "prompt": "2. every weekend / collects / stamps / Nam / from different countries", "options": [], "correct": [], "accepted": ["Nam collects stamps from different countries every weekend."], "explanation": "Dịch: Nam sưu tầm tem từ các nước khác nhau vào mỗi cuối tuần.\nGiải thích: Hiện tại đơn (every weekend): chủ ngữ Nam + collects (có -s) + tân ngữ; “from different countries” bổ nghĩa cho stamps; trạng ngữ thời gian ở cuối.", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["2. every weekend / collects / stamps / Nam / from different countries", "Đáp án: Nam collects stamps from different countries every weekend.", "Dịch: Nam sưu tầm tem từ các nước khác nhau vào mỗi cuối tuần.", "Giải thích: Hiện tại đơn (every weekend): chủ ngữ Nam + collects (có -s) + tân ngữ; “from different countries” bổ nghĩa cho stamps; trạng ngữ thời gian ở cuối."], "id": 135, "sectionIndex": 6, "withinSection": 2}, {"section": "VII. SENTENCE REARRANGEMENT", "number": 3, "prompt": "3. is / playing badminton / her favourite hobby / Mai's / after school", "options": [], "correct": [], "accepted": ["Mai's favourite hobby is playing badminton after school."], "explanation": "Dịch: Sở thích yêu thích của Mai là chơi cầu lông sau giờ học.\nGiải thích: Cụm “Mai’s favourite hobby” làm chủ ngữ, “is” là động từ, “playing badminton after school” làm bổ ngữ.", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["3. is / playing badminton / her favourite hobby / Mai's / after school", "Đáp án: Mai's favourite hobby is playing badminton after school.", "Dịch: Sở thích yêu thích của Mai là chơi cầu lông sau giờ học.", "Giải thích: Cụm “Mai’s favourite hobby” làm chủ ngữ, “is” là động từ, “playing badminton after school” làm bổ ngữ."], "id": 136, "sectionIndex": 6, "withinSection": 3}, {"section": "VII. SENTENCE REARRANGEMENT", "number": 4, "prompt": "4. everyday / should drink / enough water / We / to stay healthy", "options": [], "correct": [], "accepted": ["We should drink enough water everyday to stay healthy."], "explanation": "Dịch: Chúng ta nên uống đủ nước mỗi ngày để giữ sức khỏe.\nGiải thích: Cấu trúc should + V; “to stay healthy” chỉ mục đích nên đặt cuối câu. (Chuẩn chính tả là “every day”; đề viết “everyday”.)", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["4. everyday / should drink / enough water / We / to stay healthy", "Đáp án: We should drink enough water everyday to stay healthy.", "Dịch: Chúng ta nên uống đủ nước mỗi ngày để giữ sức khỏe.", "Giải thích: Cấu trúc should + V; “to stay healthy” chỉ mục đích nên đặt cuối câu. (Chuẩn chính tả là “every day”; đề viết “everyday”.)"], "id": 137, "sectionIndex": 6, "withinSection": 4}, {"section": "VII. SENTENCE REARRANGEMENT", "number": 5, "prompt": "5. should eat / more fruit and vegetables / Teenagers / every day / to be healthy", "options": [], "correct": [], "accepted": ["Teenagers should eat more fruit and vegetables every day to be healthy."], "explanation": "Dịch: Thanh thiếu niên nên ăn nhiều trái cây và rau mỗi ngày để khỏe mạnh.\nGiải thích: Chủ ngữ Teenagers + should eat + tân ngữ + thời gian + mục đích.", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["5. should eat / more fruit and vegetables / Teenagers / every day / to be healthy", "Đáp án: Teenagers should eat more fruit and vegetables every day to be healthy.", "Dịch: Thanh thiếu niên nên ăn nhiều trái cây và rau mỗi ngày để khỏe mạnh.", "Giải thích: Chủ ngữ Teenagers + should eat + tân ngữ + thời gian + mục đích."], "id": 138, "sectionIndex": 6, "withinSection": 5}, {"section": "VII. SENTENCE REARRANGEMENT", "number": 6, "prompt": "6. helps / us / Exercise / stay strong / and healthy", "options": [], "correct": [], "accepted": ["Exercise helps us stay strong and healthy."], "explanation": "Dịch: Tập thể dục giúp chúng ta khỏe mạnh và cường tráng.\nGiải thích: Cấu trúc help + O + (to) V: helps us stay strong and healthy.", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["6. helps / us / Exercise / stay strong / and healthy", "Đáp án: Exercise helps us stay strong and healthy.", "Dịch: Tập thể dục giúp chúng ta khỏe mạnh và cường tráng.", "Giải thích: Cấu trúc help + O + (to) V: helps us stay strong and healthy."], "id": 139, "sectionIndex": 6, "withinSection": 6}, {"section": "VII. SENTENCE REARRANGEMENT", "number": 7, "prompt": "7. clean / We / our school / every Saturday / with our friends", "options": [], "correct": [], "accepted": ["We clean our school with our friends every Saturday."], "explanation": "Dịch: Chúng tôi dọn dẹp trường cùng bạn bè vào mỗi thứ Bảy.\nGiải thích: Hiện tại đơn: We + clean + our school; “with our friends” đứng trước trạng ngữ thời gian “every Saturday”.", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["7. clean / We / our school / every Saturday / with our friends", "Đáp án: We clean our school with our friends every Saturday.", "Dịch: Chúng tôi dọn dẹp trường cùng bạn bè vào mỗi thứ Bảy.", "Giải thích: Hiện tại đơn: We + clean + our school; “with our friends” đứng trước trạng ngữ thời gian “every Saturday”."], "id": 140, "sectionIndex": 6, "withinSection": 7}, {"section": "VII. SENTENCE REARRANGEMENT", "number": 8, "prompt": "8. poor children / some old books / gave / The students / last Sunday", "options": [], "correct": [], "accepted": ["The students gave some old books to poor children last Sunday."], "explanation": "Dịch: Các học sinh đã tặng một số sách cũ cho trẻ em nghèo vào Chủ nhật tuần trước.\nGiải thích: Quá khứ đơn (last Sunday): gave + vật + to + người. Cũng có thể viết “gave poor children some old books last Sunday”.", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["8. poor children / some old books / gave / The students / last Sunday", "Đáp án: The students gave some old books to poor children last Sunday.", "Dịch: Các học sinh đã tặng một số sách cũ cho trẻ em nghèo vào Chủ nhật tuần trước.", "Giải thích: Quá khứ đơn (last Sunday): gave + vật + to + người. Cũng có thể viết “gave poor children some old books last Sunday”."], "id": 141, "sectionIndex": 6, "withinSection": 8}]}, {"title": "VIII. REWRITE", "intro": "Các dạng thường gặp: like/love/enjoy + V-ing → be keen on / be interested in / be into + V-ing; “because” → “so” (đảo nguyên nhân và kết quả); “What is your favourite…?” → “What … do you like best?”; câu mệnh lệnh → You should / shouldn’t; “It’s important that…”; “It’s a good idea to…”.", "questions": [{"section": "VIII. REWRITE", "number": 1, "prompt": "1. Nam likes playing badminton after school.", "options": [], "correct": [], "accepted": ["Nam is keen on playing badminton after school."], "explanation": "Dịch: Nam thích chơi cầu lông sau giờ học.\nGiải thích: like + V-ing = be keen on + V-ing (cũng có thể: be interested in / be into).", "context": "Các dạng thường gặp: like/love/enjoy + V-ing → be keen on / be interested in / be into + V-ing; “because” → “so” (đảo nguyên nhân và kết quả); “What is your favourite…?” → “What … do you like best?”; câu mệnh lệnh → You should / shouldn’t; “It’s important that…”; “It’s a good idea to…”.", "source": ["1. Nam likes playing badminton after school.", "Đáp án: → Nam is keen on playing badminton after school.", "Dịch: Nam thích chơi cầu lông sau giờ học.", "Giải thích: like + V-ing = be keen on + V-ing (cũng có thể: be interested in / be into)."], "id": 142, "sectionIndex": 7, "withinSection": 1}, {"section": "VIII. REWRITE", "number": 2, "prompt": "2. Mai enjoys doing exercise every morning.", "options": [], "correct": [], "accepted": ["Mai is interested in doing exercise every morning."], "explanation": "Dịch: Mai thích tập thể dục mỗi sáng.\nGiải thích: enjoy + V-ing = be interested in + V-ing (cũng có thể: be keen on / be into).", "context": "Các dạng thường gặp: like/love/enjoy + V-ing → be keen on / be interested in / be into + V-ing; “because” → “so” (đảo nguyên nhân và kết ing enough water every day is also important.\nSecond, we should exercise regularly. We can walk, run, cycle, swim, or play football with our friends. We do not need to exercise for many hours. About thirty minutes a day is good for our health. Exercise helps us become stronger and feel happier.\nFinally, we need to get enough sleep. Teenagers should sleep about eight to ten hours a night. We should go to bed early and get up at a regular time. We should also stop using our phones before going to bed. If we eat healthy food, exercise regularly, drink enough water, and get enough sleep, we can stay healthy and enjoy our lives.\nDịch bài (Một cuộc sống khỏe mạnh): Khỏe mạnh là rất quan trọng. Tất cả chúng ta đều muốn khỏe mạnh và hạnh phúc. Để có cuộc sống lành mạnh, chúng ta cần có một số thói quen tốt.\nThứ nhất, chúng ta nên ăn thực phẩm lành mạnh. Chúng ta nên ăn nhiều trái cây và rau vì chúng tốt cho cơ thể. Chúng ta cũng nên ăn cá, trứng, thịt và cơm. Chúng ta không nên ăn quá nhiều đồ ăn nhanh, kẹo hay kem. Uống đủ nước mỗi ngày cũng rất quan trọng.\nThứ hai, chúng ta nên tập thể dục đều đặn. Chúng ta có thể đi bộ, chạy, đạp xe, bơi hoặc chơi bóng đá với bạn bè. Chúng ta không cần tập trong nhiều giờ. Khoảng ba mươi phút mỗi ngày là tốt cho sức khỏe. Tập thể dục giúp chúng ta khỏe hơn và cảm thấy vui hơn.\nCuối cùng, chúng ta cần ngủ đủ giấc. Thanh thiếu niên nên ngủ khoảng tám đến mười tiếng mỗi đêm. Chúng ta nên đi ngủ sớm và dậy vào giờ cố định. Chúng ta cũng nên ngừng dùng điện thoại trước khi đi ngủ. Nếu ăn uống lành mạnh, tập thể dục đều đặn, uống đủ nước và ngủ đủ giấc, chúng ta có thể khỏe mạnh và tận hưởng cuộc sống.\nA. True or False", "context": "PASSAGE 1 – Linh’s Hobby\nLinh is fourteen years old. She has an interesting hobby. She likes making small models of houses and buildings. She started this hobby three years ago. Her father gave her a model kit for her birthday.\nAt first, making models was difficult for Linh. The pieces were very small, and she sometimes put them in the wrong place. But she did not stop. She watched some videos and learned how to make better models.\nNow, Linh spends about two hours a week on her hobby. She usually makes models at the weekend. She likes choosing different colours for the doors, windows, and walls. Sometimes, she puts small trees and people around her models.\nLinh likes this hobby because it is fun and helps her learn new things. It also makes her more patient and creative. In the future, she wants to be an architect because she likes designing houses and buildings.\nDịch bài (Sở thích của Linh): Linh mười bốn tuổi. Cô bé có một sở thích thú vị. Cô thích làm những mô hình nhỏ của nhà và tòa nhà. Cô bắt đầu sở thích này cách đây ba năm. Bố cô tặng cô một bộ mô hình nhân dịp sinh nhật.\nLúc đầu, làm mô hình rất khó với Linh. Các mảnh ghép rất nhỏ, và đôi khi cô đặt chúng sai chỗ. Nhưng cô không bỏ cuộc. Cô xem một vài video và học cách làm những mô hình đẹp hơn.\nBây giờ, Linh dành khoảng hai giờ mỗi tuần cho sở thích này. Cô thường làm mô hình vào cuối tuần. Cô thích chọn các màu khác nhau cho cửa ra vào, cửa sổ và tường. Đôi khi, cô đặt những cái cây nhỏ và những hình người nhỏ quanh mô hình.\nLinh thích sở thích này vì nó vui và giúp cô học được những điều mới. Nó cũng khiến cô kiên nhẫn và sáng tạo hơn. Trong tương lai, cô muốn trở thành kiến trúc sư vì cô thích thiết kế nhà và tòa nhà.\nA. True or False", "source": ["6. When does Linh usually make models? (Linh thường làm mô hình khi nào?)", "A. In the morning.  B. At the weekend.  C. At school.  D. At night.", "Đáp án: B. At the weekend.", "Giải thích: Đoạn 3: “She usually makes models at the weekend.” (Cô thường làm mô hình vào cuối tuần).", "PASSAGE 2 – A Healthy Life", "Being healthy is very important. We all want to be strong and happy. To have a healthy life, we need to have some good habits.", "First, we should eat healthy food. We should eat more fruit and vegetables because they are good for our bodies. We làm mọi việc theo cách khác.", "Giải thích: Bổ nghĩa cho động từ “do” cần trạng từ: different → differently."], "id": 109, "sectionIndex": 5, "withinSection": 1}, {"section": "VI. WORD FORMATION", "number": 2, "prompt": "2. He _______ gets home about six o’clock. (usual)", "options": [], "correct": [], "accepted": ["usually"], "explanation": "Dịch: Anh ấy thường về nhà khoảng sáu giờ.\nGiải thích: Trạng từ tần suất đứng trước động từ thường: usual → usually.", "context": "Mẹo làm bài: trước hết xác định từ loại cần điền (danh từ, động từ, tính từ hay trạng từ), sau đó thêm tiền tố hoặc hậu tố phù hợp. Sau tính từ cần danh từ; bổ nghĩa cho động từ cần trạng từ; sau “be” cần tính từ; sau chủ ngữ cần động từ.", "source": ["2. He _______ gets home about six o’clock. (usual)", "Đáp án: usually", "Dịch: Anh ấy thường về nhà khoảng sáu giờ.", "Giải thích: Trạng từ tần suất đứng trước động từ thường: usual → usually."], "id": 110, "sectionIndex": 5, "withinSection": 2}, {"section": "VI. WORD FORMATION", "number": 3, "prompt": "3. She is building the dollhouse _______. (skill)", "options": [], "correct": [], "accepted": ["skilfully (skillfully)", "skilfully", "skillfully"], "explanation": "Dịch: Cô ấy đang xây ngôi nhà búp bê một cách khéo léo.\nGiải thích: Cần trạng từ bổ nghĩa cho “is building”: skill → skilful (tính từ) → skilfully (trạng từ).", "context": "Mẹo làm bài: trước hết xác định từ loại cần điền (danh từ, động từ, tính từ hay trạng từ), sau đó thêm tiền tố hoặc hậu tố phù hợp. Sau tính từ cần danh từ; bổ nghĩa cho động từ cần trạng từ; sau “be” cần tính từ; sau chủ ngữ cần động từ.", "source": ["3. She is building the dollhouse _______. (skill)", "Đáp án: skilfully (skillfully)", "Dịch: Cô ấy đang xây ngôi nhà búp bê một cách khéo léo.", "Giải thích: Cần trạng từ bổ nghĩa cho “is building”: skill → skilful (tính từ) → skilfully (trạng từ)."], "id": 111, "sectionIndex": 5, "withinSection": 3}, {"section": "VI. WORD FORMATION", "number": 4, "prompt": "4. They ____ end): chủ ngữ Nam + collects (có -s) + tân ngữ; “from different countries” bổ nghĩa cho stamps; trạng ngữ thời gian ở cuối."], "id": 135, "sectionIndex": 6, "withinSection": 2}, {"section": "VII. SENTENCE REARRANGEMENT", "number": 3, "prompt": "3. is / playing badminton / her favourite hobby / Mai's / after school", "options": [], "correct": [], "accepted": ["Mai's favourite hobby is playing badminton after school."], "explanation": "Dịch: Sở thích yêu thích của Mai là chơi cầu lông sau giờ học.\nGiải thích: Cụm “Mai’s favourite hobby” làm chủ ngữ, “is” là động từ, “playing badminton after school” làm bổ ngữ.", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["3. is / playing badminton / her favourite hobby / Mai's / after school", "Đáp án: Mai's favourite hobby is playing badminton after school.", "Dịch: Sở thích yêu thích của Mai là chơi cầu lông sau giờ học.", "Giải thích: Cụm “Mai’s favourite hobby” làm chủ ngữ, “is” là động từ, “playing badminton after school” làm bổ ngữ."], "id": 136, "sectionIndex": 6, "withinSection": 3}, {"section": "VII. SENTENCE REARRANGEMENT", "number": 4, "prompt": "4. everyday / should drink / enough water / We / to stay healthy", "options": [], "correct": [], "accepted": ["We should drink enough water everyday to stay healthy."], "explanation": "Dịch: Chúng ta nên uống đủ nước mỗi ngày để giữ sức khỏe.\nGiải thích: Cấu trúc should + V; “to stay healthy” chỉ mục đích nên đặt cuối câu. (Chuẩn chính tả là “every day”; đề viết “everyday”.)", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["4. everyday / should drink / enough water / We / to stay healthy", "Đáp án: We should drink enough water everyday to stay healthy.", "Dịch: Chúng ta nên uống đủ nước mỗi ngày để giữ sức khỏe.", "Giải thích: Cấu trúc should + V; “to stay healthy” chỉ mục đích nên đặt cuối câu. (Chuẩn chính tả là “every day”; đề viết “everyday”.)"], "id": 137, "sectionIndex": 6, "withinSection": 4}, {"section": "VII. SENTENCE REARRANGEMENT", "number": 5, "prompt": "5. should eat / more fruit and vegetables / Teenagers / every day / to be healthy", "options": [], "correct": [], "accepted": ["Teenagers should eat more fruit and vegetables every day to be healthy."], "explanation": "Dịch: Thanh thiếu niên nên ăn nhiều trái cây và rau mỗi ngày để khỏe mạnh.\nGiải thích: Chủ ngữ Teenagers + should eat + tân ngữ + thời gian + mục đích.", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["5. should eat / more fruit and vegetables / Teenagers / every day / to be healthy", "Đáp án: Teenagers should eat more fruit and vegetables every day to be healthy.", "Dịch: Thanh thiếu niên nên ăn nhiều trái cây và rau mỗi ngày để khỏe mạnh.", "Giải thích: Chủ ngữ Teenagers + should eat + tân ngữ + thời gian + mục đích."], "id": 138, "sectionIndex": 6, "withinSection": 5}, {"section": "VII. SENTENCE REARRANGEMENT", "number": 6, "prompt": "6. helps / us / Exercise / stay strong / and healthy", "options": [], "correct": [], "accepted": ["Exercise helps us stay strong and healthy."], "explanation": "Dịch: Tập thể dục giúp chúng ta khỏe mạnh và cường tráng.\nGiải thích: Cấu trúc help + O + (to) V: helps us stay strong and healthy.", "context": "Mẹo làm bài: xác định chủ ngữ, động từ, tân ngữ, rồi đặt trạng ngữ (nơi chốn, thời gian, tần suất) ở cuối câu hoặc đầu câu cho đúng vị trí.", "source": ["6. helps / us / Exercise / stay strong / and healthy", "Đáp án: Exercise helps us stay strong and healthy.", "Dịch: Tập thể dục giúp chúng ta khỏe mạnh và cường tráng.", "Giải thích: Cấu trúc help + O + (to) V: helps us stay strong and healthy."], "id": 139, "sectionIndex": 6, "withinSection": 6}, {"section": "VII. SENTENCE R {"section": "VIII. REWRITE", "number": 1, "prompt": "1. Nam likes playing badminton after school.", "options": [], "correct": [], "accepted": ["Nam is keen on playing badminton after school."], "explanation": "Dịch: Nam thích chơi cầu lông sau giờ học.\nGiải thích: like + V-ing = be keen on + V-ing (cũng có thể: be interested in / be into).", "context": "Các dạng thường gặp: like/love/enjoy + V-ing → be keen on / be interested in / be into + V-ing; “because” → “so” (đảo nguyên nhân và kết quả); “What is your favourite…?” → “What … do you like best?”; câu mệnh lệnh → You should / shouldn’t; “It’s important that…”; “It’s a good idea to…”.", "source": ["1. Nam likes playing badminton after school.", "Đáp án: → Nam is keen on playing badminton after school.", "Dịch: Nam thích chơi cầu lông sau giờ học.", "Giải thích: like + V-ing = be keen on + V-ing (cũng có thể: be interested in / be into)."], "id": 142, "sectionIndex": 7, "withinSection": 1}, {"section": "VIII. REWRITE", "number": 2, "prompt": "2. Mai enjoys doing exercise every morning.", "options": [], "correct": [], "accepted": ["Mai is interested in doing exercise every morning."], "explanation": "Dịch: Mai thích tập thể dục mỗi sáng.\nGiải thích: enjoy + V-ing = be interested in + V-ing (cũng có thể: be keen on / be into).", "context": "Các dạng thường gặp: like/love/enjoy + V-ing → be keen on / be interested in / be into + V-ing; “because” → “so” (đảo nguyên nhân và kết quả); “What is your favourite…?” → “What … do you like best?”; câu mệnh lệnh → You should / shouldn’t; “It’s important that…”; “It’s a good idea to…”.", "source": ["2. Mai enjoys doing exercise every morning.", "Đáp án: → Mai is interested in doing exercise every morning.", "Dịch: Mai thích tập thể dục mỗi sáng.", "Giải thích: enjoy + V-ing = be interested in + V-ing (cũng có thể: be keen on / be into)."], "id": 143, "sectionIndex": 7, "withinSection": 2}, {"section": "VIII. REWRITE", "number": 3, "prompt": "3. Lan loves helping old people in her free time.", "options": [], "correct": [], "accepted": ["Lan is keen on helping old people in her free time."], "explanation": "Dịch: Lan thích giúp đỡ người già vào thời gian rảnh.\nGiải thích: love + V-ing = be keen on / be interested in / be into + V-ing.", "context": "Các dạng thường gặp: like/love/enjoy + V-ing → be keen on / be interested in / be into + V-ing; “because” → “so” (đảo nguyên nhân và kết quả); “What is your favourite…?” → “What … do you like best?”; câu mệnh lệnh → You should / shouldn’t; “It’s important that…”; “It’s a good idea to…”.", "source": ["3. Lan loves helping old people in her free time.", "Đáp án: → Lan is keen on helping old people in her free time.", "Dịch: Lan thích giúp đỡ người già vào thời gian rảnh.", "Giải thích: love + V-ing = be keen on / be interested in / be into + V-ing."], "id": 144, "sectionIndex": 7, "withinSection": 3}, {"section": "VIII. REWRITE", "number": 4, "prompt": "4. Tom doesn't like eating fast food.", "options": [], "correct": [], "accepted": ["Tom dislikes eating fast food."], "explanation": "Dịch: Tom không thích ăn đồ ăn nhanh.\nGiải thích: don’t like = dislike; sau dislike dùng V-ing.", "context": "Các dạng thường gặp: like/love/enjoy + V-ing → be keen on / be interested in / be into + V-ing; “because” → “so” (đảo nguyên nhân và kết quả); “What is your favourite…?” → “What … do you like best?”; câu mệnh lệnh → You should / shouldn’t; “It’s important that…”; “It’s a good idea to…”.", "source": ["4. Tom doesn't like eating fast food.", "Đáp án: → Tom dislikes eating fast food.", "Dịch: Tom không thích ăn đồ ăn nhanh.", "Giải thích: don’t like = dislike; sau dislike dùng V-ing."], "id": 145, "sectionIndex": 7, "withinSection": 4}, {"section": "VIII. REWRITE", "number": 5, "prompt": "5. Peter hates cleaning the streets with his classmates.", "options": [], "correct": [], "accepted": ["Peter is not into cleaning the streets with his classmates."], "explanation": "Dịch: Peter không thích dọn đường phố cùng cá very day."], "explanation": "Dịch: Nam muốn giữ sức khỏe, vì vậy cậu ấy uống đủ nước mỗi ngày.\nGiải thích: Nguyên nhân đứng trước “so”, kết quả đứng sau “so”.", "context": "Các dạng thường gặp: like/love/enjoy + V-ing → be keen on / be interested in / be into + V-ing; “because” → “so” (đảo nguyên nhân và kết quả); “What is your favourite…?” → “What … do you like best?”; câu mệnh lệnh → You should / shouldn’t; “It’s important that…”; “It’s a good idea to…”.", "source": ["7. Nam drinks enough water every day because he wants to stay healthy.", "Đáp án: → Nam wants to stay healthy, so he drinks enough water every day.", "Dịch: Nam muốn giữ sức khỏe, vì vậy cậu ấy uống đủ nước mỗi ngày.", "Giải thích: Nguyên nhân đứng trước “so”, kết quả đứng sau “so”."], "id": 148, "sectionIndex": 7, "withinSection": 7}, {"section": "VIII. REWRITE", "number": 8, "prompt": "8. Lan eats a lot of fruit and vegetables because they are good for her health.", "options": [], "correct": [], "accepted": ["Fruit and vegetables are good for Lan's health, so she eats a lot of them."], "explanation": "Dịch: Trái cây và rau tốt cho sức khỏe của Lan, vì vậy cô ấy ăn nhiều chúng.\nGiải thích: Có thể viết “she eats a lot of fruit and vegetables”. Dùng “them” để tránh lặp từ.", "context": "Các dạng thường gặp: like/love/enjoy + V-ing → be keen on / be interested in / be into + V-ing; “because” → “so” (đảo nguyên nhân và kết quả); “What is your favourite…?” → “What … do you like best?”; câu mệnh lệnh → You should / shouldn’t; “It’s important that…”; “It’s a good idea to…”.", "source": ["8. Lan eats a lot of fruit and vegetables because they are good for her health.", "Đáp án: → Fruit and vegetables are good for Lan's health, so she eats a lot of them.", "Dịch: Trái cây và rau tốt cho sức khỏe của Lan, vì vậy cô ấy ăn nhiều chúng.", "Giải thích: Có thể viết “she eats a lot of fruit and vegetables”. Dùng “them” để tránh lặp từ."], "id": 149, "sectionIndex": 7, "withinSection": 8}, {"section": "VIII. REWRI sectionIndex": 7, "withinSection": 19}, {"section": "VIII. REWRITE", "number": 20, "prompt": "20. Help old people in your neighbourhood.", "options": [], "correct": [], "accepted": ["It’s a good idea to help old people in your neighbourhood."], "explanation": "Dịch: Giúp đỡ người già trong khu phố của bạn là một ý hay.\nGiải thích: It’s a good idea to + V (nguyên mẫu).", "context": "Các dạng thường gặp: like/love/enjoy + V-ing → be keen on / be interested in / be into + V-ing; “because” → “so” (đảo nguyên nhân và kết quả); “What is your favourite…?” → “What … do you like best?”; câu mệnh lệnh → You should / shouldn’t; “It’s important that…”; “It’s a good idea to…”.", "source": ["20. Help old people in your neighbourhood.", "Đáp án: → It’s a good idea to help old people in your neighbourhood.", "Dịch: Giúp đỡ người già trong khu phố của bạn là một ý hay.", "Giải thích: It’s a good idea to + V (nguyên mẫu)."], "id": 161, "sectionIndex": 7, "withinSection": 20}]};
const questions = DATA.questions;
let current = 0;
let answers = {};
let submitted = false;
let score = 0;
const $ = id => document.getElementById(id);
function normalize(value){return String(value??'').toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[.!?;,:'"()]/g,' ').replace(/\s+/g,' ').trim();}
function isCorrect(q, answer){
  if(!answer) return false;
  if(q.options && q.options.length) return q.correct.includes(String(answer));
  const n=normalize(answer);
  return (q.accepted||[]).some(a=>normalize(a)===n);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function answerText(q){
 if(q.options && q.options.length){return q.options.filter(o=>q.correct.includes(o.label)).map(o=>o.label+'. '+o.text).join(' / ')}
 return (q.accepted||[])[0]||'—';
}
function answerValue(q){return answers[q.id]??'';}
function contextHtml(q){return q.context ? `<div class="context"><div class="context-title">${q.context.startsWith('READING')||q.context.startsWith('PASSAGE')?'Bài đọc':'Gợi ý / hướng dẫn'}</div>${esc(q.context)}</div>` : '';}
function render(){
 const q=questions[current];
 $('progressPill').textContent=`Câu ${current+1} / ${questions.length}`;
 $('progress').style.width=`${((current+1)/questions.length)*100}%`;
 $('prevBtn').disabled=current===0;
 $('nextBtn').disabled=current===questions.length-1;
 $('submitBtn').hidden=submitted;
 $('restartBtn').hidden=!submitted;
 $('modePill').textContent=submitted?'Đã chấm bài':'Chưa nộp bài';
 let options='';
 if(q.options && q.options.length){
   options=`<div class="choices">${q.options.map(o=>{const chosen=String(answerValue(q))===o.label;let cls='choice'+(chosen?' selected':'');if(submitted&&q.correct.includes(o.label))cls+=' correct';if(submitted&&chosen&&!q.correct.includes(o.label))cls+=' wrong';return `<label class="${cls}"><input type="radio" name="answer" value="${esc(o.label)}" ${chosen?'checked':''} ${submitted?'disabled':''}><span><strong>${esc(o.label)}.</strong> ${esc(o.text)}</span></label>`}).join('')}</div>`;
 }else{
   const ok=submitted&&isCorrect(q,answerValue(q));
   options=`<label for="textAnswer"><strong>Nhập câu trả lời:</strong></label><input class="answer-input ${submitted?(ok?'correct':'wrong'):''}" id="textAnswer" name="answer" type="text" autocomplete="off" placeholder="Gõ đáp án bằng tiếng Anh…" value="${esc(answerValue(q))}" ${submitted?'disabled':''}>`;
 }
 let feedback='';
 if(submitted){
  const ok=isCorrect(q,answerValue(q));
  feedback=`<div class="feedback ${ok?'good':'bad'}"><h3>${ok?'✓ Chính xác!':'✗ Chưa chính xác'}</h3><p><strong>Đáp án:</strong> ${esc(answerText(q))}</p>${!answerValue(q)?'<p>Bạn chưa trả lời câu này.</p>':''}${q.explanation?`<p><strong>Giải thích / dịch nghĩa:</strong>\n${esc(q.explanation)}</p>`:''}</div>`;
 }
 $('quizCard').innerHTML=`<div class="section-label">${esc(q.section)}</div><div class="question-number">Câu ${q.withinSection} trong phần này</div>${contextHtml(q)}<div class="prompt">${esc(q.prompt)}</div>${options}${feedback}`;
 if(!submitted){
  $('quizCard').querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',()=>{answers[q.id]=el.value;renderChoiceOnly();}));
  const ti=$('textAnswer');if(ti)ti.addEventListener('input',()=>{answers[q.id]=ti.value;});
 }
}
function renderChoiceOnly(){
 const q=questions[current];
 $('quizCard').querySelectorAll('.choice').forEach(label=>{const input=label.querySelector('input');label.classList.toggle('selected',input.checked);});
}
function submitQuiz(){
 if(submitted)return;
 const unanswered=questions.filter(q=>!String(answers[q.id]??'').trim()).length;
 if(unanswered>0&&!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`))return;
 score=questions.reduce((sum,q)=>sum+(isCorrect(q,answers[q.id])?1:0),0);
 submitted=true;
 $('results').hidden=false;
 $('results').innerHTML=`<div class="scoreline"><div><div class="tiny">KẾT QUẢ CỦA BẠN</div><div class="score">${score} / ${questions.length}</div></div><div><strong>${Math.round(score/questions.length*100)}%</strong><div class="muted">${score===questions.length?'Xuất sắc! Bạn đã trả lời đúng tất cả.':`Bạn trả lời đúng ${score} câu và cần xem lại ${questions.length-score} câu.`}</div></div></div><div class="result-actions"><button class="btn-secondary" id="reviewWrong">Xem câu sai</button><button class="btn-secondary" id="reviewAll">Xem lại từ câu 1</button></div>`;
 $('reviewWrong').addEventListener('click',()=>{const first=questions.findIndex(q=>!isCorrect(q,answers[q.id]));current=first<0?0:first;render();});
 $('reviewAll').addEventListener('click',()=>{current=0;render();});
 render();window.scrollTo({top:0,behavior:'smooth'});
}
function restart(){current=0;answers={};submitted=false;score=0;$('results').hidden=true;$('results').innerHTML='';render();window.scrollTo({top:0,behavior:'smooth'});}
$('prevBtn').addEventListener('click',()=>{if(current>0){current--;render();}});
$('nextBtn').addEventListener('click',()=>{if(current<questions.length-1){current++;render();}});
$('submitBtn').addEventListener('click',submitQuiz);
$('restartBtn').addEventListener('click',restart);
$('totalPill').textContent=`${questions.length} câu hỏi · ${DATA.sections.length} phần`;
render();
</script></body></html>
